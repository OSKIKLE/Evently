{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Evently - Logowanie</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        .login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #dddddd;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }
        .form-control:focus {
            border-color: #A200FF;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <a href="/">
            <img src="{% static 'logo.png' %}" alt="Evently Logo" style="height: 50px; margin-bottom: 30px; cursor: pointer;">
        </a>
        
        <h2 style="color: #A200FF; font-weight: 700; margin-bottom: 25px;">Zaloguj się</h2>
        
        {% if error_message %}
            <div style="background-color: #ffeef0; color: #f44336; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; font-weight: 600; border: 1px solid #ffcdd2;">
                {{ error_message }}
            </div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Nazwa użytkownika</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Wpisz login..." required>
            </div>
            
            <div class="form-group">
                <label for="password">Hasło</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Wpisz hasło..." required>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px; background: #A200FF; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer;">Zaloguj się</button>
            
            <div style="margin-top: 20px; font-size: 14px; color: #555;">
                Nie masz konta? 
                <a href="/rejestracja/" style="color: #A200FF; text-decoration: none; font-weight: 600;">zarejestruj się</a>
            </div>
        </form>
    </div>

</body>
</html>
